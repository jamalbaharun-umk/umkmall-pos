# Local Postgres for development and tests. Port 5544 avoids clashing with other local databases.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: pos
      POSTGRES_DB: pos
    ports:
      - '5544:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos']
      interval: 2s
      retries: 20
