name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: pos
        ports: ['5544:5432']
        options: >-
          --health-cmd "pg_isready -U pos" --health-interval 2s --health-retries 20
    env:
      PGTEST_HOST: localhost:5544
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx turbo lint
      - name: Typecheck
        run: npx turbo typecheck
      - name: Test (pos-api against Postgres)
        run: npx turbo test
      - name: Build
        run: npx turbo build
